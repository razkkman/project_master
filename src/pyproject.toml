[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "porous-morphology-ssa"
version = "2.0.0"
authors = [
    { name = "Yury Pilipenko", email = "yury.pilipenko@example.com" }
]
description = "Комплекс численных методов исследования взаимосвязи удельной площади поверхности с морфологией пористых сред"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "Pillow>=8.0.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "openpyxl>=3.0.0",
]

[project.scripts]
porous-cli = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "methods*", "topology*", "synthetic*", "preprocessing*", "pipeline*"]
